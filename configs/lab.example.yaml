# Example lab configuration for the Azure VM.
# Secrets never go into this file: every *_env key names an environment variable.
# Only the default and fallback providers need their API key; others without one are left out.

server:
  http_addr: ":443"
  mqtt_tls_addr: ":8883"
  mqtt_plain_addr: ""            # local development only, e.g. ":1883"
  tls:
    mode: autocert               # off | autocert
    hosts: [lab.example.org, mqtt.example.org]
    cache_dir: /var/lib/labserver/autocert
  admin_password_env: LAB_ADMIN_PASSWORD
  lab_code_env: LAB_CODE           # optional: fixed lab code instead of a generated one
  db_path: /var/lib/labserver/lab.db

llm:
  default: mistral
  fallback: ollama
  providers:
    mistral:
      base_url: https://api.mistral.ai/v1
      api_key_env: MISTRAL_API_KEY
      model: mistral-small-latest  # pin a fixed version for competitions
      price_in: 0.1                # EUR per million tokens, for the cost display; check current prices
      price_out: 0.3
    claude:
      kind: anthropic              # Claude Messages API via the official Anthropic Go SDK
      api_key_env: ANTHROPIC_API_KEY  # Console API key; Max/Ultra/Team plans include monthly API credits
      model: claude-haiku-5-5      # cheapest; or claude-sonnet-5-5, claude-opus-5-5
      effort: low                  # low | medium | high | xhigh | max; empty = model default
      price_in: 0.10               # list price in USD per million tokens (Haiku 5.5, prompts up to 100K
      price_out: 0.50              # tokens); enter EUR for exact euros. Sonnet 5.5: 2 / 10, Opus 5.5: 4 / 20
    test:
      kind: fake                   # scripted test model without network, for rehearsals
    ollama:
      base_url: http://localhost:11434/v1
      model: "<local model with tool calling>"
  max_parallel_calls: 5

budgets:
  max_steps_per_wakeup: 12
  max_tokens_per_run: 200000
  max_agent_messages_per_minute: 6
  max_run_minutes: 20              # a run ends after this long
  max_history_messages: 40         # older messages of a run leave the model context

robots:
  - { id: mbot-1, password_env: MBOT1_PASSWORD, color: red }
  - { id: mbot-2, password_env: MBOT2_PASSWORD, color: blue }
  - { id: mbot-3, password_env: MBOT3_PASSWORD, color: green }
  - { id: mbot-4, password_env: MBOT4_PASSWORD, color: yellow }
  - { id: mbot-5, password_env: MBOT5_PASSWORD, color: purple }

# Teams join on /join with the lab code shown in the control room (/admin).
# The control room assigns robots to teams; both are stored in the database.
