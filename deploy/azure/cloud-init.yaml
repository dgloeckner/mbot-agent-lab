#cloud-config
# Prepares an Ubuntu VM for labserver. The binary is installed by `nx run server:deploy`;
# config and secrets go into /etc/labserver by hand (see README.md).
users:
  - default
  - name: labserver
    system: true
    shell: /usr/sbin/nologin
package_update: true
packages: [sqlite3, ufw]
runcmd:
  - [mkdir, -p, /etc/labserver, /var/lib/labserver]
  - [chown, "labserver:labserver", /var/lib/labserver]
  - [ufw, allow, OpenSSH]
  - [ufw, allow, 80/tcp]
  - [ufw, allow, 443/tcp]
  - [ufw, allow, 8883/tcp]
  - [ufw, --force, enable]
