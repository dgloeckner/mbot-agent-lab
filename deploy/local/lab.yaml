# Local development: plain MQTT on :1883, HTTP on :8080, no TLS.
# `make dev` sets the environment variables below to development values.

server:
  http_addr: "127.0.0.1:8080"
  mqtt_plain_addr: ":1883"
  tls: { mode: "off" }
  admin_password_env: LAB_ADMIN_PASSWORD
  db_path: lab-dev.db

llm:
  default: mistral
  fallback: ollama
  providers:
    mistral:
      base_url: https://api.mistral.ai/v1
      api_key_env: MISTRAL_API_KEY
      model: mistral-small-latest
    ollama:
      base_url: http://localhost:11434/v1
      model: qwen3

robots:
  - { id: mbot-1, password_env: MBOT1_PASSWORD, color: red }
  - { id: mbot-2, password_env: MBOT2_PASSWORD, color: blue }

teams:
  - { id: rot,  name: "Team Rot",  token_env: TEAM_ROT_TOKEN }
  - { id: blau, name: "Team Blau", token_env: TEAM_BLAU_TOKEN }

profile: einzel
profiles:
  einzel:
    rot:  { ich: mbot-1 }
    blau: { ich: mbot-2 }
  duo:
    rot: { links: mbot-1, rechts: mbot-2 }
