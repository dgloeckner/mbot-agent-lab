# Local development: plain MQTT on :1883, HTTP on :8080, no TLS.
# `npx nx run server:dev` sets the environment variables below to development values.

server:
  http_addr: "127.0.0.1:8080"
  mqtt_plain_addr: ":1883"
  tls: { mode: "off" }
  admin_password_env: LAB_ADMIN_PASSWORD
  lab_code_env: LAB_CODE           # optional: fixed lab code instead of a generated one
  db_path: lab-dev.db

llm:
  # "test" is a scripted model: it explores with the real tools and needs no
  # API key. Set default to mistral (and MISTRAL_API_KEY) or claude (and
  # ANTHROPIC_API_KEY) to use a real model.
  default: test
  providers:
    test:
      kind: fake
    mistral:
      base_url: https://api.mistral.ai/v1
      api_key_env: MISTRAL_API_KEY
      model: mistral-small-latest
      price_in: 0.1     # EUR per million tokens, check current prices
      price_out: 0.3
    claude:
      kind: anthropic
      api_key_env: ANTHROPIC_API_KEY
      model: claude-haiku-5-5   # cheapest; claude-sonnet-5-5 or claude-opus-5-5 for harder tasks
      effort: low
      price_in: 0.10    # USD list price per million tokens (Sonnet 5.5: 2 / 10, Opus 5.5: 4 / 20)
      price_out: 0.50
    ollama:
      base_url: http://localhost:11434/v1
      model: qwen3

budgets:
  max_steps_per_wakeup: 12
  max_tokens_per_run: 200000
  max_agent_messages_per_minute: 6
  max_run_minutes: 20
  max_history_messages: 40

robots:
  - { id: mbot-1, password_env: MBOT1_PASSWORD, color: red }
  - { id: mbot-2, password_env: MBOT2_PASSWORD, color: blue }
  - { id: mbot-3, password_env: MBOT3_PASSWORD, color: green }

# Teams join on /join with the lab code shown in the control room (/admin).
# The control room assigns robots to teams; both are stored in the database.
