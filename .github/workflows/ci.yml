name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_DAEMON: "false"
      NX_NO_CLOUD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Nx
        run: npm ci

      - name: Lint, test, build, bundle
        run: npx nx run-many -t lint test build-linux bundle --outputStyle=static
