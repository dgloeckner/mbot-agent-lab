name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_DAEMON: "false"
      NX_NO_CLOUD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Nx
        run: npm ci

      - name: Lint, test, build, bundle
        run: npx nx run-many -t lint test build-linux bundle --outputStyle=static

      - name: End-to-end smoke test (server + simulated robot + scripted model)
        run: npx nx run sim:e2e --outputStyle=static

      - name: Browser for the page tests
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests (team page in Chromium, same lab as sim:e2e)
        run: npx nx run web:e2e --outputStyle=static

      - name: Screenshots of the page tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-screenshots
          path: web/e2e/screenshots/
          if-no-files-found: ignore
